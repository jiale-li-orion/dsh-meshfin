name: E2E (E2B sandbox)

# This suite provisions external E2B sandboxes and is intentionally opt-in.
# It has no push, pull_request, schedule, or workflow_call trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2b:
    runs-on: ubuntu-latest
    name: E2B live Loader composition
    timeout-minutes: 30
    steps:
      # GitHub forbids `secrets` in a job-level `if:`, so the guard is a step:
      # its output gates every later step in this lane. This deployment runs
      # keyless by choice, so an unconfigured credential reports a notice and
      # skips rather than failing the run.
      - name: Probe for the E2B API key
        id: key
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -n "${E2B_API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "E2B_API_KEY_EXTERNAL is configured; running the live sandbox suite."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2B_API_KEY_EXTERNAL is not configured — skipping the E2B sandbox lane."
          fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.present == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v6
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # The Loader smoke runs package exports under plain Node in lib mode.
      - name: Build (lib for the E2B Loader smoke)
        if: steps.key.outputs.present == 'true'
        run: pnpm run build

      - name: E2B tests (live sandbox)
        if: steps.key.outputs.present == 'true'
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY_EXTERNAL }}
          DSH_E2E_MAX_WORKERS: '1'
          DSH_EXAMPLE_MODE: lib
        run: >-
          pnpm exec vitest run --config vitest.e2e.config.ts
          packages/e2b/e2b/tests/composition.e2e.ts
