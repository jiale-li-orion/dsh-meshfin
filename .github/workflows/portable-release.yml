# Portable distributions: one tag turns a commit into the three downloads a
# reader actually needs — the WSL/Linux archive, the Windows archive, and the
# Android shell — and replaces them in place on the rolling releases, so
# `/releases/download/pc-wsl/...` keeps working across versions.
#
# The archives are built the same way a maintainer builds them locally, through
# the repository's own release output: `pack.ts` produces the tarballs the npm
# release publishes, and `portable.ts` assembles them with a Node runtime, the
# community modules already installed, and the desktop launcher.
name: Portable distributions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: 22.23.2
  # The Windows archive carries its own runtime; this is the Node release its
  # node.exe comes from.
  WINDOWS_NODE_VERSION: 22.19.0

jobs:
  portable:
    name: portable archives (WSL/Linux and Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the harness
        run: pnpm run build

      - name: Pack the release families
        run: |
          npx tsx scripts/release/pack.ts --family vendor --out dist/npm-vendor
          npx tsx scripts/release/pack.ts --family dsh --out dist/npm-dsh

      - name: Pack the native launcher entry
        run: |
          mkdir -p dist/npm-native
          npm pack --pack-destination "$PWD/dist/npm-native" \
            native/landlock-run/packages/entry

      - name: Fetch the Windows Node runtime
        run: |
          mkdir -p .artifacts/win-node
          curl -sSL -o .artifacts/win-node/node-win.zip \
            "https://nodejs.org/dist/v${WINDOWS_NODE_VERSION}/node-v${WINDOWS_NODE_VERSION}-win-x64.zip"
          python3 - <<'PY'
          import pathlib, zipfile
          archive = zipfile.ZipFile('.artifacts/win-node/node-win.zip')
          member = next(name for name in archive.namelist() if name.endswith('/node.exe'))
          pathlib.Path('.artifacts/win-node/node.exe').write_bytes(archive.read(member))
          PY

      - name: Assemble the WSL/Linux distribution
        run: |
          npx tsx scripts/release/portable.ts \
            --tarballs dist/npm-vendor --tarballs dist/npm-dsh --tarballs dist/npm-native \
            --out dist/meshfin-linux-x64 --runtime "$(command -v node)" --platform posix

      - name: Assemble the Windows distribution
        run: |
          npx tsx scripts/release/portable.ts \
            --tarballs dist/npm-vendor --tarballs dist/npm-dsh --tarballs dist/npm-native \
            --out dist/meshfin-windows-x64 --runtime .artifacts/win-node/node.exe --platform windows

      - name: Smoke-test the WSL/Linux distribution
        run: |
          set -euo pipefail
          env -u DSH_HOME ./dist/meshfin-linux-x64/meshfin web --port 3299 &
          server=$!
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:3299/; then
              echo "portable distribution served its Web UI"
              kill "$server" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "the portable distribution never answered on 3299" >&2
          kill "$server" 2>/dev/null || true
          exit 1

      - name: Archive
        run: |
          tar czf dist/meshfin-linux-x64.tar.gz -C dist meshfin-linux-x64
          (cd dist && zip -qr meshfin-windows-x64.zip meshfin-windows-x64)

      - uses: actions/upload-artifact@v7
        with:
          name: portable-archives
          path: |
            dist/meshfin-linux-x64.tar.gz
            dist/meshfin-windows-x64.zip
          retention-days: 7

  # The Windows archive is assembled on Linux, which cannot execute it. This job
  # is what makes "the Windows build works" a fact instead of an expectation: it
  # expands the same archive a reader downloads and serves its Web UI on Windows.
  windows-smoke:
    name: Windows archive on Windows
    needs: portable
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: portable-archives
          path: artifacts

      - name: Expand the archive
        shell: pwsh
        run: Expand-Archive -Path artifacts/meshfin-windows-x64.zip -DestinationPath expanded -Force

      - name: Run the harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & .\expanded\meshfin-windows-x64\meshfin.ps1 --version
          Write-Host "reported version: $version"
          if ($version -notmatch '^\d+\.\d+') { throw "unexpected --version output: $version" }

      - name: Serve the Web UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Start-Process -FilePath powershell -PassThru -NoNewWindow -ArgumentList @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', '.\expanded\meshfin-windows-x64\meshfin.ps1', 'web', '--port', '3399'
          )
          try {
            $ok = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3399/' -TimeoutSec 3 -UseBasicParsing
                if ($response.StatusCode -eq 200 -and $response.Content.Length -gt 0) {
                  Write-Host "served $($response.Content.Length) bytes"
                  $ok = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ok) { throw 'the Windows distribution never answered on 3399' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  android:
    name: Android shell
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the debug APK
        run: gradle -p apps/android-shell assembleDebug

      - name: Read the built label back
        run: |
          # aapt2 lives in the SDK's build-tools, not on PATH; the label is what
          # the phone shows after installing, so the build is not trusted blind.
          aapt2="$(find "${ANDROID_HOME}/build-tools" -name aapt2 -type f | sort | tail -1)"
          test -n "$aapt2"
          "$aapt2" dump badging apps/android-shell/app/build/outputs/apk/debug/app-debug.apk \
            | grep -E 'application-label|package: name'

      - uses: actions/upload-artifact@v7
        with:
          name: android-shell
          path: apps/android-shell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  publish:
    name: publish the rolling releases
    needs: [portable, windows-smoke, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Replace the rolling release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="artifacts/android-shell/app-debug.apk"
          linux="artifacts/portable-archives/meshfin-linux-x64.tar.gz"
          windows="artifacts/portable-archives/meshfin-windows-x64.zip"
          cp "$apk" dsh-shell.apk

          # `gh release upload` replaces an asset in place, so the download URLs
          # documented in the README survive every release. The APK is published
          # under its stable name, not the name the build gave it.
          publish() {
            tag="$1"; file="$2"; title="$3"
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" "$file" --clobber
            else
              gh release create "$tag" "$file" --title "$title" \
                --notes "Built from $GITHUB_SHA by the Portable distributions workflow."
            fi
          }
          publish android-shell dsh-shell.apk "DSH-Meshfin Android shell — rolling build"
          publish pc-wsl "$linux" "Meshfin for WSL / Linux x64 — portable"
          publish pc-windows "$windows" "Meshfin for Windows x64 — portable"
