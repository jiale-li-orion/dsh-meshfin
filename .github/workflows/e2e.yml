name: E2E

# End-to-end signal, in two lanes that both run on demand and nightly:
#
#   keyless   — `pnpm run test:snapshot`: the recorded-transcript replay. It
#               exercises the real assembled application while the model and API
#               interactions come from recorded fixtures, so it needs no
#               credentials. A replay cannot detect drift in the live API — only
#               the real-api lane can — and nothing here pretends it does.
#   real-api  — `pnpm run test:e2e` against https://api.deepseek.com. It runs
#               only when the repository secret DEEPSEEK_API_KEY_EXTERNAL is
#               configured. The presence probe is a step rather than a job-level
#               `if:` because GitHub does not allow `secrets` there; a missing
#               secret reports a notice and skips the remaining steps instead of
#               failing the run.
#
# The push and pull_request triggers belong to ci.yml, which runs the same
# keyless snapshots as part of its consumer gate; repeating them here would only
# duplicate that work.
#
# SECURITY — if a real-API run ever needs to move back onto pull requests, NEVER
# use `pull_request_target`: it runs in the base repository's context WITH
# secrets while still able to check out untrusted fork code, which is a textbook
# key-leak vector. GitHub withholds secrets from forked pull requests under the
# plain `pull_request` trigger, which is what keeps an untrusted fork from
# exfiltrating the key.
on:
  workflow_dispatch:
  schedule:
    # 00:17 UTC nightly = 08:17 Asia/Shanghai — off the top-of-hour cron stampede.
    - cron: '17 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: both lanes only read the repository.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  keyless:
    runs-on: ubuntu-latest
    name: keyless replay
    # Bounded file parallelism (DSH_E2E_MAX_WORKERS) sized for the 4-core hosted
    # runner; the nightly replay is a safety net, not a latency-critical gate.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The snapshot harness boots the example bins in `lib` mode
      # (DSH_EXAMPLE_MODE=lib): the built artifact under plain Node, resolving
      # plugins through real package exports — the shape a real consumer runs.
      # That requires a prior build.
      - name: Build (lib for the example bins)
        run: pnpm run build

      - name: Keyless end-to-end replay
        env:
          DSH_EXAMPLE_MODE: lib
          DSH_E2E_MAX_WORKERS: 4
          DSH_SNAPSHOT_MAX_CONCURRENCY: 4
        run: pnpm run test:snapshot

  real-api:
    runs-on: ubuntu-latest
    name: real API
    # Bounded file parallelism (DSH_E2E_MAX_WORKERS), 120s/test, retry 2. 45m
    # still bounds retry storms against a slow API while the happy path fans out.
    timeout-minutes: 45
    steps:
      # GitHub forbids `secrets` in a job-level `if:`, so the guard is a step:
      # its output gates every later step in this lane.
      - name: Probe for the real-API key
        id: key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "DEEPSEEK_API_KEY_EXTERNAL is configured; running the real-API suite."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEEPSEEK_API_KEY_EXTERNAL is not configured — skipping the real-API lane. The keyless replay lane in this workflow, and ci.yml on every push, still cover the assembled application."
          fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.present == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v6
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Install
      # bwrap so the runs that do have a key exercise it; the userns knob is
      # best-effort and the test's functional probe decides.
      - name: Install bubblewrap (unrestrict userns)
        if: steps.key.outputs.present == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns knob absent — the functional probe decides"

      - name: Build (lib for the e2e example bins)
        if: steps.key.outputs.present == 'true'
        run: pnpm run build

      # DEEPSEEK_BASE_URL is pinned to the external API so a stray repo-root
      # .env cannot redirect the run; the secret is scoped to this step only and
      # never exposed to checkout/setup/install.
      - name: E2E tests (real DeepSeek API)
        if: steps.key.outputs.present == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DSH_E2E_MAX_WORKERS: 14
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
