# dsh bundle patch: inserts this plugin into a profile's layer stack.
# One row drives both halves: the Host API (lib/index.js, injects webServer and
# serves /dsh-archived/inspect) and the browser page (lib/client.js, discovered
# through the dsh.client declaration in package.json, which claims the shipped
# `settings.section` slot id `archived-sessions`).
- insert:
    - id: archived-sessions
      name: '@muwinds/dsh-archived-sessions'
