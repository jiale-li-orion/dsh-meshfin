# dsh bundle patch: the Host rows that carry this distribution's own surface.
#
# Each row is a shipped package of this repository, so a profile that selects
# this bundle gains exactly four capabilities the official composition does
# not have: a context view that inspects, rewrites and reviews what the next
# request is built from; a workbench view the browser and the agent both
# mutate, with Range/206/416 byte serving; the model-facing tools for both; and
# a statement of which class of client sent each turn's prompt, which matters
# because one session is driven from a phone and a computer.
- insert:
    # Compaction provider resolution: a prepared commit runs against whichever
    # engine this service resolves, so it has to be composed before the context
    # service that commits through it.
    - id: compactions
      name: '@deepseek-ai/dsh-compaction/directory'

    # Context: the Host service, its model-facing tools, and the browser view
    # that renders them beside Chat.
    - id: session-context
      name: '@deepseek-ai/dsh-session-context'
    - id: tool-session-context
      name: '@deepseek-ai/dsh-tool-session-context'
    - id: ui-context
      name: '@deepseek-ai/dsh-client-ui-context'

    # Workbench: one committed view the browser and the agent share, the
    # authenticated byte route its preview reads, and the agent's own controls.
    - id: workbench
      name: '@deepseek-ai/dsh-workbench'
    - id: workbench-bytes
      name: '@deepseek-ai/dsh-workbench-bytes'
    - id: tool-workbench
      name: '@deepseek-ai/dsh-tool-workbench'
    - id: ui-workbench
      name: '@deepseek-ai/dsh-client-ui-workbench'

    # Client origin: tells the model which class of client sent the open turn's
    # prompt, read back from the durable user message rather than the transport.
    - id: client-origin
      name: '@deepseek-ai/dsh-client-origin'
